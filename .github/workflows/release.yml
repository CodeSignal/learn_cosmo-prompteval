# Attach a deployable tarball to a GitHub release.
# `npm run pack` builds a minified client + single-file server bundle (no
# node_modules) into dist.tar.gz. Unpack, add a local .env (and optionally
# session.config.json), then start with `node server.js`.

name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Populate design system submodule
        run: git submodule update --init

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Pack release
        run: npm run pack

      - name: Upload build artifact (for workflow logs)
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist.tar.gz

      - name: Upload asset to existing release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          artifacts: dist.tar.gz
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
