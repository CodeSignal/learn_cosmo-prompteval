# One-shot evaluation agent. Create a fresh session per run so there is no
# shared conversation history between repeated evaluations.
input:
  MODEL:
    type: string
    optional: true
    default: "anthropic/claude-sonnet-4-6"
    description: LLM model for this eval session (provider/model-id format).
  TEMPERATURE:
    type: number
    optional: true
    default: 0.7
    description: Sampling temperature (0-2).

triggers:
  run-prompt:
    input:
      PROMPT:
        type: string
        description: Fully rendered prompt to evaluate (template + input already substituted).

agent:
  model: MODEL
  system: system
  temperature: TEMPERATURE
  # Intentionally no tools/skills/webSearch — keep runs comparable and cheap.

handlers:
  run-prompt:
    Add prompt:
      block: add-message
      role: user
      prompt: user-prompt
      input: [PROMPT]
      uiContent: PROMPT
      display: hidden

    Respond:
      block: next-message
